services:
  nginx:
    image: nginx:1.27-alpine
    container_name: tphermes-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "8033:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - tphermes-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://47.113.225.93:8033}
        NEXT_PUBLIC_USE_MOCK_KB: ${NEXT_PUBLIC_USE_MOCK_KB:-}
    image: ${TPDHERMES_FRONTEND_IMAGE:-tphermes-frontend:prod}
    container_name: tphermes-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    expose:
      - "3000"
    networks:
      - tphermes-net

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    image: ${TPDHERMES_BACKEND_IMAGE:-tphermes-backend:prod}
    container_name: tphermes-backend
    restart: unless-stopped
    depends_on:
      - hermes-agent
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:////app/data/tphermes.db}
      - HERMES_CHAT_API_URL=${HERMES_CHAT_API_URL:-http://hermes-agent:8642/v1/chat/completions}
      - HERMES_CHAT_API_KEY=${HERMES_CHAT_API_KEY:-change-me}
      - HERMES_CHAT_MODEL=${HERMES_CHAT_MODEL:-hermes-agent}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://47.113.225.93:8033}
      - CHROMA_HOST=${CHROMA_HOST:-http://your-chroma-host:8001}
      - FEISHU_APP_ID=${FEISHU_APP_ID:-}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
    expose:
      - "8000"
    volumes:
      - tphermes-data:/app/data
    networks:
      - tphermes-net

  hermes-agent:
    # If you deploy Hermes-agent from local sources, replace `image` with:
    # build:
    #   context: ../Hermes-agent
    #   dockerfile: Dockerfile
    image: ${HERMES_AGENT_IMAGE:-ghcr.io/your-org/hermes-agent:latest}
    container_name: hermes-agent
    restart: unless-stopped
    environment:
      - PORT=8642
      - API_SERVER_KEY=${HERMES_AGENT_API_SERVER_KEY:-change-me}
    expose:
      - "8642"
    networks:
      - tphermes-net

volumes:
  tphermes-data:

networks:
  tphermes-net:
    driver: bridge
