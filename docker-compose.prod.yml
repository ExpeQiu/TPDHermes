services:
  nginx:
    image: nginx:1.27-alpine
    container_name: tphermes-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
      hermes-agent:
        condition: service_started
    ports:
      - "8033:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - tphermes-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://47.113.225.93:8033}
        NEXT_PUBLIC_USE_MOCK_KB: ${NEXT_PUBLIC_USE_MOCK_KB:-}
    image: ${TPDHERMES_FRONTEND_IMAGE:-tphermes-frontend:prod}
    container_name: tphermes-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    expose:
      - "3000"
    networks:
      - tphermes-net

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    image: ${TPDHERMES_BACKEND_IMAGE:-tphermes-backend:prod}
    container_name: tphermes-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:////app/data/tphermes.db}
      - HERMES_CHAT_API_URL=${HERMES_CHAT_API_URL:-http://hermes-agent:8642/v1/chat/completions}
      - HERMES_CHAT_API_KEY=${HERMES_CHAT_API_KEY:-change-me}
      - HERMES_CHAT_MODEL=${HERMES_CHAT_MODEL:-hermes-agent}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://47.113.225.93:8033}
      - OBSIDIAN_VAULT_ROOT=${OBSIDIAN_VAULT_ROOT:-}
      - CHROMA_HOST=${CHROMA_HOST:-http://your-chroma-host:8001}
      - KB_EMBED_ENABLED=${KB_EMBED_ENABLED:-1}
      - KB_EMBED_ON_UPSERT=${KB_EMBED_ON_UPSERT:-1}
      - KB_EMBED_MODEL=${KB_EMBED_MODEL:-BAAI/bge-small-zh-v1.5}
      - KB_EMBED_CACHE_DIR=${KB_EMBED_CACHE_DIR:-/app/.cache/huggingface}
      - KB_EMBED_BOOT_PRELOAD=${KB_EMBED_BOOT_PRELOAD:-1}
      - KB_EMBED_BOOT_PRELOAD_TIMEOUT_SEC=${KB_EMBED_BOOT_PRELOAD_TIMEOUT_SEC:-240}
      - KB_EMBED_BOOT_PRELOAD_STRICT=${KB_EMBED_BOOT_PRELOAD_STRICT:-0}
      - KB_EMBED_WARMUP=${KB_EMBED_WARMUP:-1}
      - KB_EMBED_WARMUP_BLOCKING=${KB_EMBED_WARMUP_BLOCKING:-1}
      - KB_EMBED_WARMUP_TIMEOUT_SEC=${KB_EMBED_WARMUP_TIMEOUT_SEC:-180}
      - HF_HOME=${HF_HOME:-/app/.cache/huggingface}
      - HUGGINGFACE_HUB_CACHE=${HUGGINGFACE_HUB_CACHE:-/app/.cache/huggingface/hub}
      - TRANSFORMERS_CACHE=${TRANSFORMERS_CACHE:-/app/.cache/huggingface/transformers}
      - SENTENCE_TRANSFORMERS_HOME=${SENTENCE_TRANSFORMERS_HOME:-/app/.cache/huggingface/sentence_transformers}
      - KB_LOCAL_RANK_MAX_DOCS=${KB_LOCAL_RANK_MAX_DOCS:-500}
      - FEISHU_APP_ID=${FEISHU_APP_ID:-}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
      - HERMES_AGENT_CONFIG_PATH=${HERMES_AGENT_CONFIG_PATH:-/app/hermes-agent/config.yaml}
      - TPDHERMES_GLOBAL_ADMIN_USER_IDS=${TPDHERMES_GLOBAL_ADMIN_USER_IDS:-}
      - TPDHERMES_DEFAULT_USER_ROLE=${TPDHERMES_DEFAULT_USER_ROLE:-tenant_admin}
      - TPDHERMES_TRUST_CLIENT_ROLE_HEADER=${TPDHERMES_TRUST_CLIENT_ROLE_HEADER:-0}
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          python -c "import sys, urllib.request;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).getcode() == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    volumes:
      - tphermes-data:/app/data
      - tphermes-hf-cache:/app/.cache/huggingface
      - ./skills:/app/skills
      - ./deploy/hermes-agent/config.yaml:/app/hermes-agent/config.yaml
    networks:
      - tphermes-net

  tphermes-mcp:
    build:
      context: .
      dockerfile: backend.Dockerfile
    image: ${TPDHERMES_BACKEND_IMAGE:-tphermes-backend:prod}
    container_name: tphermes-mcp
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:////app/data/tphermes.db}
      - CHROMA_HOST=${CHROMA_HOST:-http://your-chroma-host:8001}
      - KB_EMBED_ENABLED=${KB_EMBED_ENABLED:-1}
      - KB_EMBED_ON_UPSERT=${KB_EMBED_ON_UPSERT:-1}
      - KB_EMBED_MODEL=${KB_EMBED_MODEL:-BAAI/bge-small-zh-v1.5}
      - KB_EMBED_CACHE_DIR=${KB_EMBED_CACHE_DIR:-/app/.cache/huggingface}
      - KB_EMBED_BOOT_PRELOAD=${KB_EMBED_BOOT_PRELOAD_MCP:-0}
      - KB_EMBED_BOOT_PRELOAD_TIMEOUT_SEC=${KB_EMBED_BOOT_PRELOAD_TIMEOUT_SEC:-240}
      - KB_EMBED_BOOT_PRELOAD_STRICT=${KB_EMBED_BOOT_PRELOAD_STRICT:-0}
      - KB_EMBED_WARMUP=${KB_EMBED_WARMUP:-1}
      - KB_EMBED_WARMUP_BLOCKING=${KB_EMBED_WARMUP_BLOCKING:-1}
      - KB_EMBED_WARMUP_TIMEOUT_SEC=${KB_EMBED_WARMUP_TIMEOUT_SEC:-180}
      - HF_HOME=${HF_HOME:-/app/.cache/huggingface}
      - HUGGINGFACE_HUB_CACHE=${HUGGINGFACE_HUB_CACHE:-/app/.cache/huggingface/hub}
      - TRANSFORMERS_CACHE=${TRANSFORMERS_CACHE:-/app/.cache/huggingface/transformers}
      - SENTENCE_TRANSFORMERS_HOME=${SENTENCE_TRANSFORMERS_HOME:-/app/.cache/huggingface/sentence_transformers}
      - KB_LOCAL_RANK_MAX_DOCS=${KB_LOCAL_RANK_MAX_DOCS:-500}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - TAVILY_REMOTE_MCP_URL=${TAVILY_REMOTE_MCP_URL:-https://mcp.tavily.com/mcp/}
      - FEISHU_APP_ID=${FEISHU_APP_ID:-}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
      - TPDHERMES_MCP_HOST=${TPDHERMES_MCP_HOST:-0.0.0.0}
      - TPDHERMES_MCP_PORT=${TPDHERMES_MCP_PORT:-8801}
      - TPDHERMES_MCP_PATH=${TPDHERMES_MCP_PATH:-/mcp}
      - TPDHERMES_MCP_TRANSPORT=${TPDHERMES_MCP_TRANSPORT:-streamable-http}
      - TPDHERMES_MCP_LOG_LEVEL=${TPDHERMES_MCP_LOG_LEVEL:-info}
    command: ["python", "-m", "backend.mcp_http_server"]
    expose:
      - "8801"
    volumes:
      - tphermes-data:/app/data
      - tphermes-hf-cache:/app/.cache/huggingface
      - ./skills:/app/skills
    networks:
      - tphermes-net

  hermes-agent:
    # If you deploy Hermes-agent from local sources, replace `image` with:
    # build:
    #   context: ../Hermes-agent
    #   dockerfile: Dockerfile
    image: ${HERMES_AGENT_IMAGE:-ghcr.io/your-org/hermes-agent:latest}
    container_name: hermes-agent
    restart: unless-stopped
    depends_on:
      tphermes-mcp:
        condition: service_started
      backend:
        condition: service_healthy
    command: ["gateway", "run"]
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      - HERMES_HOME=/opt/data
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - PORT=8642
      - API_SERVER_KEY=${HERMES_AGENT_API_SERVER_KEY:-change-me}
      - TPDHERMES_MCP_URL=${TPDHERMES_MCP_URL:-http://tphermes-mcp:8801/mcp}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NOUS_API_KEY=${NOUS_API_KEY:-}
      - GLM_API_KEY=${GLM_API_KEY:-}
      - KIMI_API_KEY=${KIMI_API_KEY:-}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - MINIMAX_CN_API_KEY=${MINIMAX_CN_API_KEY:-}
      - MINIMAX_CN_BASE_URL=${MINIMAX_CN_BASE_URL:-}
      - FEISHU_APP_ID=${FEISHU_APP_ID:-}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
      - FEISHU_DOMAIN=${FEISHU_DOMAIN:-feishu}
      - FEISHU_CONNECTION_MODE=${FEISHU_CONNECTION_MODE:-websocket}
      - FEISHU_ENCRYPT_KEY=${FEISHU_ENCRYPT_KEY:-}
      - FEISHU_VERIFICATION_TOKEN=${FEISHU_VERIFICATION_TOKEN:-}
      - FEISHU_ALLOWED_USERS=${FEISHU_ALLOWED_USERS:-}
      - FEISHU_GROUP_POLICY=${FEISHU_GROUP_POLICY:-allowlist}
      - FEISHU_ALLOW_BOTS=${FEISHU_ALLOW_BOTS:-none}
      - FEISHU_HOME_CHANNEL=${FEISHU_HOME_CHANNEL:-}
      - FEISHU_HOME_CHANNEL_NAME=${FEISHU_HOME_CHANNEL_NAME:-}
      - FEISHU_HOME_CHANNEL_THREAD_ID=${FEISHU_HOME_CHANNEL_THREAD_ID:-}
      - FEISHU_BOT_OPEN_ID=${FEISHU_BOT_OPEN_ID:-}
      - FEISHU_BOT_USER_ID=${FEISHU_BOT_USER_ID:-}
      - FEISHU_BOT_NAME=${FEISHU_BOT_NAME:-}
    volumes:
      - hermes-agent-data:/opt/data
      - ./deploy/hermes-agent/config.yaml:/opt/data/config.yaml:ro
      - ./deploy/hermes-agent/SOUL.md:/opt/data/SOUL.md:ro
    expose:
      - "8642"
    networks:
      - tphermes-net

volumes:
  tphermes-data:
  tphermes-hf-cache:
  hermes-agent-data:

networks:
  tphermes-net:
    driver: bridge
