[mypy-backend.routes.skills_store]
ignore_errors = True

[mypy-backend.middleware.exception_handler]
ignore_errors = True

[mypy-backend.services.skill_lifecycle]
ignore_errors = True

[mypy-backend.services.kb_cache]
ignore_errors = True
