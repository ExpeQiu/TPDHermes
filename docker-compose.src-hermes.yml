# 使用本仓库内嵌 Hermes Agent 源码构建（替代占位 stub）。
# 前置：源码在 hermes-agent/hermes-agent-main/（当前上游 v0.21.3 / tag v2026.9.14）。
# 构建（务必开启 BuildKit，否则 Dockerfile.alicloud 内缓存挂载不生效）：
#   DOCKER_BUILDKIT=1 docker compose -f docker-compose.yml -f docker-compose.src-hermes.yml build hermes-agent
# 启动：DOCKER_BUILDKIT=1 docker compose -f docker-compose.yml -f docker-compose.src-hermes.yml up -d
# 0.21+ 入口已是 s6-overlay（entrypoint-dispatch.sh）；不要覆盖为旧的 tini/entrypoint.sh。
# 首次需在数据卷中配置 LLM：容器启动后编辑 /opt/data/.env。
services:
  hermes-agent:
    build:
      context: ./hermes-agent/hermes-agent-main
      dockerfile: Dockerfile.alicloud
    image: ${HERMES_AGENT_IMAGE:-tphermes-hermes-src:local}
    container_name: hermes-agent
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      - HERMES_UID=10000
      - HERMES_GID=10000
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - API_SERVER_KEY=${HERMES_AGENT_API_SERVER_KEY:-change-me}
    expose:
      - "8642"
    volumes:
      - hermes-agent-data:/opt/data
    networks:
      - tphermes-net

volumes:
  hermes-agent-data:
