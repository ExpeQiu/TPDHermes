model:
  default: "MiniMax-M2.7-highspeed"
  provider: "minimax-cn"
  base_url: "https://api.minimaxi.com/anthropic"

mcp_servers:
  tphermes:
    url: http://tphermes-mcp:8801/mcp
    enabled: true
    timeout: 120
    connect_timeout: 30
    tools:
      include:
        - kb_query
        - kb_list_collections
        - kb_get_entry
        - kb_add_entry
        - workshop_list_skills
        - workshop_get_skill_info
        - workshop_generate
        - workshop_generate_from_kb
        - project_list
        - project_create
        - project_get
        - tavily_search
        - tavily_extract
        - list_resources
        - read_resource
        - list_prompts
        - get_prompt

terminal:
  backend: "local"
  cwd: "/opt/data/workspace"
  timeout: 180
  lifetime_seconds: 300
  docker_mount_cwd_to_workspace: false

# 生产部署场景：Agent 需频繁 curl/ssh/docker 等运维命令，关闭交互式审批。
# 硬线 blocklist（rm -rf /、fork bomb 等）仍会拦截，不受此配置影响。
approvals:
  mode: off
  timeout: 90

security:
  tirith_enabled: false

compression:
  enabled: true
  threshold: 0.80

memory:
  memory_char_limit: 10000
  user_char_limit: 5000

display:
  tool_progress: all
  interim_assistant_messages: true

platforms:
  feishu:
    extra:
      require_mention: false

# Tool loop guardrails — same_tool_failure 连续失败时强制终止而非仅警告
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 4
    same_tool_failure: 5
    idempotent_no_progress: 4
