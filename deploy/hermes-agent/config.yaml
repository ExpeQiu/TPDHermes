model:
  default: "MiniMax-M2.7-highspeed"
  provider: "minimax-cn"
  base_url: "https://api.minimaxi.com/anthropic"

mcp_servers:
  tphermes:
    url: http://tphermes-mcp:8801/mcp
    enabled: true
    timeout: 120
    connect_timeout: 30
    tools:
      include:
        - kb_query
        - kb_list_collections
        - kb_get_entry
        - workshop_list_skills
        - workshop_get_skill_info
        - workshop_generate
        - workshop_generate_from_kb
        - project_list
        - project_create
        - project_get
        - tavily_search
        - tavily_extract
        - list_resources
        - read_resource
        - list_prompts
        - get_prompt

terminal:
  backend: "local"
  cwd: "/opt/data/workspace"
  timeout: 180
  lifetime_seconds: 300
  docker_mount_cwd_to_workspace: false

display:
  tool_progress: all
  interim_assistant_messages: true
