model:
  default: "MiniMax-M2.7-highspeed"
  provider: "minimax-cn"
  base_url: "https://api.minimaxi.com/anthropic"

mcp_servers:
  tphermes:
    url: http://tphermes-mcp:8801/mcp
    enabled: true
    timeout: 120
    connect_timeout: 30
    tools:
      include:
        - kb_query
        - kb_list_collections
        - kb_get_entry
        - kb_add_entry
        - workshop_list_skills
        - workshop_get_skill_info
        - workshop_generate
        - workshop_generate_from_kb
        - project_list
        - project_create
        - project_get
        - tavily_search
        - tavily_extract
        - list_resources
        - read_resource
        - list_prompts
        - get_prompt

terminal:
  backend: "local"
  cwd: "/opt/data/workspace"
  timeout: 180
  lifetime_seconds: 300
  docker_mount_cwd_to_workspace: false

# 生产部署场景：Agent 需频繁 curl/ssh/docker 等运维命令，关闭交互式审批。
# 硬线 blocklist（rm -rf /、fork bomb 等）仍会拦截，不受此配置影响。
approvals:
  mode: off
  timeout: 90

security:
  tirith_enabled: false

display:
  tool_progress: all
  interim_assistant_messages: true

platforms:
  feishu:
    extra:
      require_mention: false
