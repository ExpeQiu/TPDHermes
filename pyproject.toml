[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tpdhermes"
version = "0.1.0"
description = "TPDHermes 工作台 CLI"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28.1"]

[project.scripts]
tpdhermes = "tpdhermes.cli:main"

[tool.setuptools.packages.find]
include = ["tpdhermes*", "backend*"]

[tool.ruff]
target-version = "py312"
src = ["backend", "."]

[tool.ruff.lint]
extend-ignore = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
