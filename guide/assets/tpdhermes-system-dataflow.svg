<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1100">
  <defs>
    <style>
      .bg { fill: #f4f7fb; }
      .frame { fill: #ffffff; stroke: #d9e3f2; stroke-width: 1.5; rx: 20; }
      .zone { fill: #ffffff; stroke: #dbe4f1; stroke-width: 1.3; rx: 18; }
      .zone-chat { fill: #eef6ff; stroke: #b8d2fd; stroke-width: 1.3; rx: 18; }
      .zone-workshop { fill: #eefbf5; stroke: #bae8d0; stroke-width: 1.3; rx: 18; }
      .zone-kb { fill: #f5f0ff; stroke: #d7c8ff; stroke-width: 1.3; rx: 18; }
      .zone-store { fill: #fff6ee; stroke: #ffd8b8; stroke-width: 1.3; rx: 18; }
      .card { fill: #ffffff; stroke: #dbe4f1; stroke-width: 1.3; rx: 14; }
      .card-blue { fill: #f8fbff; stroke: #b8cdfc; stroke-width: 1.3; rx: 14; }
      .card-green { fill: #f8fffb; stroke: #b5e5cd; stroke-width: 1.3; rx: 14; }
      .card-purple { fill: #fcfaff; stroke: #d8cbff; stroke-width: 1.3; rx: 14; }
      .card-orange { fill: #fffaf6; stroke: #ffd9bb; stroke-width: 1.3; rx: 14; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 30px; font-weight: 700; fill: #1f2a44; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; fill: #62708a; }
      .zone-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 19px; font-weight: 700; fill: #24324a; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #24324a; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #5e6c84; text-anchor: middle; }
      .line-blue { fill: none; stroke: #5b8def; stroke-width: 2.5; }
      .line-green { fill: none; stroke: #31a56f; stroke-width: 2.5; }
      .line-purple { fill: none; stroke: #8b63f3; stroke-width: 2.5; }
      .line-orange { fill: none; stroke: #ef8d2f; stroke-width: 2.5; }
      .line-neutral { fill: none; stroke: #7f8ba7; stroke-width: 2.2; stroke-dasharray: 7 6; }
      .label-bg { fill: #ffffff; stroke: #d8e0ec; stroke-width: 1; rx: 10; }
      .label-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #4c596f; text-anchor: middle; dominant-baseline: central; }
      .legend-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #56647c; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#27446b" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b8def"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#31a56f"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b63f3"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef8d2f"/>
    </marker>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7f8ba7"/>
    </marker>
  </defs>

  <rect width="1680" height="1100" class="bg"/>
  <rect x="28" y="28" width="1624" height="1044" class="frame" filter="url(#shadow)"/>

  <text x="72" y="82" class="title">TPDHermes 分图版二：请求与数据流图</text>
  <text x="72" y="110" class="subtitle">专门表达运行时链路，拆成聊天主流、工坊主流、知识检索支路与结果沉淀支路，避免静态架构图中的交叉线。</text>

  <g transform="translate(56, 150)">
    <rect width="730" height="390" class="zone-chat" filter="url(#shadow)"/>
    <text x="28" y="34" class="zone-title">A. 对话创作主流</text>

    <g transform="translate(36, 78)">
      <rect width="136" height="72" class="card-blue" filter="url(#shadow)"/>
      <text x="68" y="28" class="card-title">用户输入</text>
      <text x="68" y="50" class="card-body">聊天页提问</text>
    </g>

    <g transform="translate(212, 78)">
      <rect width="160" height="72" class="card-blue" filter="url(#shadow)"/>
      <text x="80" y="28" class="card-title">前端上下文拼装</text>
      <text x="80" y="50" class="card-body">项目 / 文件 / 技能范围</text>
    </g>

    <g transform="translate(412, 78)">
      <rect width="146" height="72" class="card-blue" filter="url(#shadow)"/>
      <text x="73" y="28" class="card-title">后端编排入口</text>
      <text x="73" y="50" class="card-body">`POST /tasks/execute`</text>
    </g>

    <g transform="translate(598, 78)">
      <rect width="96" height="72" class="card-blue" filter="url(#shadow)"/>
      <text x="48" y="28" class="card-title">Hermes</text>
      <text x="48" y="50" class="card-body">推理执行</text>
    </g>

    <path d="M 172 114 L 212 114" class="line-blue" marker-end="url(#arrow-blue)"/>
    <path d="M 372 114 L 412 114" class="line-blue" marker-end="url(#arrow-blue)"/>
    <path d="M 558 114 L 598 114" class="line-blue" marker-end="url(#arrow-blue)"/>

    <g transform="translate(94, 234)">
      <rect width="170" height="72" class="card" filter="url(#shadow)"/>
      <text x="85" y="28" class="card-title">Run 记录</text>
      <text x="85" y="50" class="card-body">请求快照、validation、状态</text>
    </g>

    <g transform="translate(308, 234)">
      <rect width="170" height="72" class="card" filter="url(#shadow)"/>
      <text x="85" y="28" class="card-title">Output 产物</text>
      <text x="85" y="50" class="card-body">对话正文、输出沉淀</text>
    </g>

    <g transform="translate(522, 234)">
      <rect width="146" height="72" class="card" filter="url(#shadow)"/>
      <text x="73" y="28" class="card-title">Chat Session</text>
      <text x="73" y="50" class="card-body">会话云端同步</text>
    </g>

    <path d="M 646 150 L 646 194 L 179 194 L 179 234" class="line-neutral" marker-end="url(#arrow-neutral)"/>
    <path d="M 646 150 L 646 194 L 393 194 L 393 234" class="line-neutral" marker-end="url(#arrow-neutral)"/>
    <path d="M 646 150 L 646 194 L 595 194 L 595 234" class="line-neutral" marker-end="url(#arrow-neutral)"/>

    <rect x="566" y="166" width="120" height="24" class="label-bg"/>
    <text x="626" y="178" class="label-text">流式回复后沉淀</text>
  </g>

  <g transform="translate(814, 150)">
    <rect width="730" height="390" class="zone-workshop" filter="url(#shadow)"/>
    <text x="28" y="34" class="zone-title">B. 场景工坊主流</text>

    <g transform="translate(36, 78)">
      <rect width="146" height="72" class="card-green" filter="url(#shadow)"/>
      <text x="73" y="28" class="card-title">用户选项目 / 场景</text>
      <text x="73" y="50" class="card-body">进入工坊执行任务</text>
    </g>

    <g transform="translate(222, 78)">
      <rect width="160" height="72" class="card-green" filter="url(#shadow)"/>
      <text x="80" y="28" class="card-title">后端校验绑定</text>
      <text x="80" y="50" class="card-body">项目、场景、版本、权限</text>
    </g>

    <g transform="translate(422, 78)">
      <rect width="160" height="72" class="card-green" filter="url(#shadow)"/>
      <text x="80" y="28" class="card-title">编排生成合同</text>
      <text x="80" y="50" class="card-body">skills / template / output rules</text>
    </g>

    <g transform="translate(622, 78)">
      <rect width="72" height="72" class="card-green" filter="url(#shadow)"/>
      <text x="36" y="28" class="card-title">Agent</text>
      <text x="36" y="50" class="card-body">执行</text>
    </g>

    <path d="M 182 114 L 222 114" class="line-green" marker-end="url(#arrow-green)"/>
    <path d="M 382 114 L 422 114" class="line-green" marker-end="url(#arrow-green)"/>
    <path d="M 582 114 L 622 114" class="line-green" marker-end="url(#arrow-green)"/>

    <g transform="translate(106, 234)">
      <rect width="174" height="72" class="card" filter="url(#shadow)"/>
      <text x="87" y="28" class="card-title">Tool Capture</text>
      <text x="87" y="50" class="card-body">捕获 workshop tool 正文</text>
    </g>

    <g transform="translate(320, 234)">
      <rect width="174" height="72" class="card" filter="url(#shadow)"/>
      <text x="87" y="28" class="card-title">Direct Fallback</text>
      <text x="87" y="50" class="card-body">未命中工具时直连 skill</text>
    </g>

    <g transform="translate(534, 234)">
      <rect width="160" height="72" class="card" filter="url(#shadow)"/>
      <text x="80" y="28" class="card-title">Output 落库</text>
      <text x="80" y="50" class="card-body">项目输出与执行记录</text>
    </g>

    <path d="M 658 150 L 658 194 L 193 194 L 193 234" class="line-neutral" marker-end="url(#arrow-neutral)"/>
    <path d="M 658 150 L 658 194 L 407 194 L 407 234" class="line-neutral" marker-end="url(#arrow-neutral)"/>
    <path d="M 658 150 L 658 194 L 614 194 L 614 234" class="line-neutral" marker-end="url(#arrow-neutral)"/>

    <rect x="560" y="166" width="128" height="24" class="label-bg"/>
    <text x="624" y="178" class="label-text">执行后写回项目</text>
  </g>

  <g transform="translate(56, 574)">
    <rect width="730" height="240" class="zone-kb" filter="url(#shadow)"/>
    <text x="28" y="34" class="zone-title">C. 知识检索支路</text>

    <g transform="translate(34, 78)">
      <rect width="168" height="72" class="card-purple" filter="url(#shadow)"/>
      <text x="84" y="28" class="card-title">Agent 调用 KB Tools</text>
      <text x="84" y="50" class="card-body">`kb_query` `kb_get_entry`</text>
    </g>

    <g transform="translate(252, 78)">
      <rect width="180" height="72" class="card-purple" filter="url(#shadow)"/>
      <text x="90" y="28" class="card-title">TPDHermes MCP Server</text>
      <text x="90" y="50" class="card-body">HTTP MCP 工具入口</text>
    </g>

    <g transform="translate(482, 78)">
      <rect width="214" height="72" class="card-purple" filter="url(#shadow)"/>
      <text x="107" y="28" class="card-title">KB Proxy / Cache / Ingest</text>
      <text x="107" y="50" class="card-body">优先外部 KB，失败回退本地缓存</text>
    </g>

    <path d="M 202 114 L 252 114" class="line-purple" marker-end="url(#arrow-purple)"/>
    <path d="M 432 114 L 482 114" class="line-purple" marker-end="url(#arrow-purple)"/>

    <g transform="translate(158, 170)">
      <rect width="186" height="48" class="card-orange" filter="url(#shadow)"/>
      <text x="93" y="22" class="card-title">Chroma / 外部知识库</text>
      <text x="93" y="38" class="card-body">在线检索优先</text>
    </g>

    <g transform="translate(414, 170)">
      <rect width="186" height="48" class="card-orange" filter="url(#shadow)"/>
      <text x="93" y="22" class="card-title">kb_cache</text>
      <text x="93" y="38" class="card-body">降级只读缓存</text>
    </g>

    <path d="M 589 150 L 589 170 L 251 170" class="line-orange" marker-end="url(#arrow-orange)"/>
    <path d="M 589 150 L 589 170 L 507 170" class="line-orange" marker-end="url(#arrow-orange)"/>
  </g>

  <g transform="translate(814, 574)">
    <rect width="730" height="240" class="zone-store" filter="url(#shadow)"/>
    <text x="28" y="34" class="zone-title">D. 结果沉淀与资源支路</text>

    <g transform="translate(34, 78)">
      <rect width="170" height="72" class="card-orange" filter="url(#shadow)"/>
      <text x="85" y="28" class="card-title">Output / Run</text>
      <text x="85" y="50" class="card-body">写入 SQLite</text>
    </g>

    <g transform="translate(254, 78)">
      <rect width="170" height="72" class="card-orange" filter="url(#shadow)"/>
      <text x="85" y="28" class="card-title">Project KB Ingest</text>
      <text x="85" y="50" class="card-body">输出物进入项目知识库</text>
    </g>

    <g transform="translate(474, 78)">
      <rect width="170" height="72" class="card-orange" filter="url(#shadow)"/>
      <text x="85" y="28" class="card-title">skills/ 本地技能仓</text>
      <text x="85" y="50" class="card-body">工坊与直连执行依赖</text>
    </g>

    <g transform="translate(34, 170)">
      <rect width="170" height="48" class="card" filter="url(#shadow)"/>
      <text x="85" y="22" class="card-title">SQLite</text>
      <text x="85" y="38" class="card-body">统一业务存储</text>
    </g>

    <g transform="translate(254, 170)">
      <rect width="170" height="48" class="card" filter="url(#shadow)"/>
      <text x="85" y="22" class="card-title">project.* KB 集合</text>
      <text x="85" y="38" class="card-body">供后续检索复用</text>
    </g>

    <g transform="translate(474, 170)">
      <rect width="170" height="48" class="card" filter="url(#shadow)"/>
      <text x="85" y="22" class="card-title">Embedding Cache</text>
      <text x="85" y="38" class="card-body">模型与向量化缓存</text>
    </g>

    <path d="M 119 150 L 119 170" class="line-orange" marker-end="url(#arrow-orange)"/>
    <path d="M 339 150 L 339 170" class="line-orange" marker-end="url(#arrow-orange)"/>
    <path d="M 559 150 L 559 170" class="line-orange" marker-end="url(#arrow-orange)"/>
  </g>

  <path d="M 676 540 C 676 556, 420 556, 420 574" class="line-purple" marker-end="url(#arrow-purple)"/>
  <rect x="528" y="548" width="128" height="24" class="label-bg"/>
  <text x="592" y="560" class="label-text">按需知识检索</text>

  <path d="M 1360 540 C 1360 556, 1180 556, 1180 574" class="line-orange" marker-end="url(#arrow-orange)"/>
  <rect x="1242" y="548" width="128" height="24" class="label-bg"/>
  <text x="1306" y="560" class="label-text">结果沉淀与复用</text>

  <path d="M 790 318 L 814 318" class="line-neutral" marker-end="url(#arrow-neutral)"/>
  <rect x="742" y="306" width="120" height="24" class="label-bg"/>
  <text x="802" y="318" class="label-text">同一后端能力集</text>

  <g transform="translate(1240, 58)">
    <rect width="280" height="54" class="card" filter="url(#shadow)"/>
    <circle cx="20" cy="18" r="6" fill="#5b8def"/>
    <text x="34" y="22" class="legend-text">蓝色：聊天主流</text>
    <circle cx="20" cy="38" r="6" fill="#31a56f"/>
    <text x="34" y="42" class="legend-text">绿色：工坊主流</text>
    <circle cx="146" cy="18" r="6" fill="#8b63f3"/>
    <text x="160" y="22" class="legend-text">紫色：知识检索支路</text>
    <circle cx="146" cy="38" r="6" fill="#ef8d2f"/>
    <text x="160" y="42" class="legend-text">橙色：沉淀 / 资源支路</text>
  </g>
</svg>
